# Railway service: set Root Directory to the monorepo root (not apps/api).
# Set Dockerfile Path to apps/api/Dockerfile (or use this file from repo root).

[build]
builder = "dockerfile"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
